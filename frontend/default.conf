server {
    # 1. Cambiamos el puerto al 8080 para ser compatibles con nuestra imagen unprivileged
    listen 8080;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos (tu SPA sencilla)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend en la subred privada
    location /api/ {
        # Esta IP (10.0.2.24) es la IP privada de tu instancia EC2 del Backend en AWS.
        # Nginx tomará las peticiones del Front y las reenviará a esta dirección de forma segura.
        proxy_pass http://backend:3001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}